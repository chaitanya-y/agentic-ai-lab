[project]
name = "agentic-ai-lab-customer-support-assistant"
version = "0.1.0"
description = "A Phase 2 lab for prompts, context, structured output, and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
support-assistant = "support_assistant.workflow:main"
support-eval = "support_assistant.evaluation:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
