[project]
name = "agentic-ai-lab-customer-service-agent"
version = "0.1.0"
description = "A small lab for learning provider SDKs, LangChain, and bounded agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "ollama>=0.6,<1",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_service_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
